# ============================================================
# 本地开发配置模板（application-local.example.yml）
# ------------------------------------------------------------
# 用法：
#   1. 复制本文件为 application-local.yml（.gitignore 已忽略，不会提交）
#   2. 将下方所有 <占位符> 替换为你本机的真实值
#   3. 通过 --spring.profiles.active=dev,local 或 JVM 参数指定 local profile
#
# 启动示例（Windows PowerShell）：
#   $env:DB_PASSWORD='你的密码'; .\mvnw spring-boot:run -Dspring-boot.run.profiles=dev,local
# 或在 IDE 中设置环境变量后以 profile dev,local 启动。
#
# 说明：敏感字段一律使用 ${ENV:默认} 占位，优先从环境变量读取，
#       <真实值> 仅作为没有环境变量时的回退（禁止提交真实凭据）。
# ============================================================

# ---- 应用端口 ----
server:
  port: ${SERVER_PORT:10086}

# ---- MySQL 数据源（覆盖 application-dev.yml） ----
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dochub}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 推荐优先用环境变量，本地回退避免 commit 时误带上
    password: ${DB_PASSWORD:你的数据库密码}
  jpa:
    show-sql: ${SHOW_SQL:true}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

  # ---- Redis（若未启用可留端口空置；无需密码则注释 password 行） ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ---- JWT 签名密钥（本地回退，生产由 JWT_SECRET 强制覆盖） ----
app:
  jwt:
    secret: ${JWT_SECRET:Local-Dev-Jwt-Secret-2024-Only-For-Debug-00000000000}