spring:
  application:
    name: backend
  profiles:
    active:
      - dev

# JWT 签名密钥（HS256，≥32 字节）。默认值仅用于本地开发回退；
# 生产环境务必通过环境变量 JWT_SECRET 或外部配置覆盖，禁止沿用默认值。
app:
  jwt:
    secret: ${JWT_SECRET:Local-Dev-Jwt-Secret-2024-Only-For-Debug-00000000000}
  security:
    # RSA 密码加密传输开关；私钥未配置时自动降级为明文传输
    rsa:
      private-key: ${APP_RSA_PRIVATE_KEY:}